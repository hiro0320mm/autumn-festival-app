spring:
  application:
    name: backend
  main:
    banner-mode: off

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration-postgresql
#    default-schema: PUBLIC
    table: FLYWAY_SCHEMA_HISTORY
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    org.flywaydb: TRACE
    org.springframework.boot.autoconfigure.flyway: TRACE